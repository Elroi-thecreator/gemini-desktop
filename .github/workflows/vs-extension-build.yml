name: Build Visual Studio Extension (VSIX)

on:
  push:
    branches:
      - main
      - suresh-main-work
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-vsix:
    name: Build & Package VSIX
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies & Build frontend
        run: |
          npm ci
          npm run build:vsix

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: |
          dotnet restore vs-extension/Gemini.VisualStudio.sln
          nuget restore vs-extension/Gemini.VisualStudio.sln

      - name: Build VSIX Package
        run: msbuild vs-extension/Gemini.Extension/Gemini.Extension.csproj /restore /t:Build,CreateVsixContainer /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true /p:VisualStudioVersion=17.0 /p:TemplateOutputDirectory="obj\Release\net472\" /v:normal /fl "/flp:logfile=msbuild.log;verbosity=detailed"

      - name: Locate Output Artifacts
        run: Get-ChildItem -Path vs-extension/Gemini.Extension/bin -Recurse | Select-Object FullName, Length

      - name: Verify VSIX Contents
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path vs-extension/Gemini.Extension/bin/Release -Filter "*.vsix" -Recurse | Select-Object -First 1
          if ($vsix) {
            Write-Host "Unpacking VSIX to verify embedded assets: $($vsix.FullName)"
            Expand-Archive -Path $vsix.FullName -DestinationPath "$env:RUNNER_TEMP\vsix_unpacked" -Force
            Get-ChildItem -Path "$env:RUNNER_TEMP\vsix_unpacked" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            $hasIndex = Test-Path "$env:RUNNER_TEMP\vsix_unpacked\Resources\WebDist\index.html"
            $hasRootIndex = Test-Path "$env:RUNNER_TEMP\vsix_unpacked\index.html"
            Write-Host "VSIX contains Resources\WebDist\index.html: $hasIndex"
            Write-Host "VSIX contains root index.html: $hasRootIndex"
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini.Extension.vsix
          path: vs-extension/Gemini.Extension/bin/Release/**/*.vsix
          if-no-files-found: error

      - name: Publish VSIX to GitHub Release
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vsix = Get-ChildItem -Path vs-extension/Gemini.Extension/bin/Release -Filter "*.vsix" -Recurse | Select-Object -First 1
          if ($vsix) {
            Write-Host "Publishing $($vsix.FullName) to GitHub release vsix-latest..."
            gh release create vsix-latest $vsix.FullName --title "Gemini Visual Studio Extension (Latest)" --notes "Automated CI build of Gemini.Extension.vsix for Visual Studio 2022" --prerelease --clobber
          }
