name: Build Visual Studio Extension (VSIX)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-vsix:
    name: Build & Package VSIX
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies & Build frontend
        run: |
          npm ci
          npm run build:vsix

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore NuGet packages
        run: |
          nuget restore vs-extension/Gemini.VisualStudio.sln -NonInteractive -Verbosity detailed
          dotnet restore vs-extension/Gemini.VisualStudio.sln || echo "dotnet restore skipped if not applicable"
          msbuild vs-extension/Gemini.VisualStudio.sln /t:Restore /p:Configuration=Release /p:VisualStudioVersion=17.0

      - name: Build VSIX Package
        run: msbuild vs-extension/Gemini.VisualStudio.sln /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true /p:VisualStudioVersion=17.0 /restore /v:normal /fl "/flp:logfile=msbuild.log;verbosity=detailed"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini.Extension.vsix
          path: vs-extension/Gemini.Extension/bin/Release/Gemini.Extension.vsix
          if-no-files-found: error
