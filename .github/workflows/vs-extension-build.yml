name: Build Visual Studio Extension (VSIX)

on:
  push:
    branches:
      - main
      - suresh-main-work
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-vsix:
    name: Build & Package VSIX
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies & Build frontend
        run: |
          npm ci
          npm run build:vsix

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: |
          nuget restore vs-extension/Gemini.VisualStudio.sln
          msbuild vs-extension/Gemini.VisualStudio.sln /t:Restore /p:Configuration=Release /p:VisualStudioVersion=17.0

      - name: Build VSIX Package
        run: msbuild vs-extension/Gemini.VisualStudio.sln /p:Configuration=Release /p:DeployExtension=false /p:VisualStudioVersion=17.0 /v:normal

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini.Extension.vsix
          path: vs-extension/Gemini.Extension/bin/Release/Gemini.Extension.vsix
          if-no-files-found: error
