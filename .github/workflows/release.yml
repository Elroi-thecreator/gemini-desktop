name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Application & Create GitHub Release
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Gemini Desktop v__VERSION__"
          releaseBody: "Automated release build of Gemini Desktop.\n\n- **GeminiDesktop-Portable.exe**: Standalone executable (no installation required).\n- **Setup Installer (`.exe` / `.msi`)**: Standard Windows setup installers."
          releaseDraft: false
          prerelease: false

      - name: Upload Standalone Portable Executable to Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item "src-tauri/target/release/gemini-desktop.exe" "GeminiDesktop-Portable.exe"
          $tag = "${{ steps.tauri_build.outputs.releaseTag }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag -or $tag -eq "main") {
            $json = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
            $tag = "v$($json.version)"
          }
          Write-Host "Uploading GeminiDesktop-Portable.exe to release $tag..."
          gh release upload $tag "GeminiDesktop-Portable.exe" --clobber

