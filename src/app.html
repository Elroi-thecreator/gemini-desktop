<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // SvelteKit desktop SPA path rewrite: if loaded at /index.html in WebView2, rewrite pathname to '/' before router evaluates routes
      if (typeof window !== 'undefined' && window.location && window.location.pathname.endsWith('/index.html')) {
        try {
          window.history.replaceState(null, '', window.location.pathname.replace(/\/index\.html$/, '') || '/');
        } catch (e) {}
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
