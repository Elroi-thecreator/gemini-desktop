id: PROD-TOOL-001
type: product_standard
title: Interactive Tool Permission Approval & Safe System Execution
domain: product
status: approved
version: 1.0.0
authority:
  level: official
  confidence: high
owner:
  team: security_and_product

applies_to:
  - frontend
  - backend
  - acp_client

rule:
  "When the Gemini agent requests tool execution (such as running shell commands or modifying files), the desktop UI must render an interactive approval modal allowing the user to either approve or deny the action."

do:
  - "Display the tool name, command parameters, and context reason clearly in the approval prompt."
  - "Provide distinct 'Allow' and 'Deny' buttons in the chat UI."
  - "Send the decision back through `respond_tool_permission` command over ACP stdin."
  - "Log the decision and execution outcome into the chat session history."

dont:
  - "Do not execute unconfirmed destructive system commands silently in the background."

reason:
  "Desktop agent execution must respect user sovereignty and safety, preventing accidental or malicious file tampering."

related_items:
  - ARCH-ACP-001
  - DEV-SVELTE-001
