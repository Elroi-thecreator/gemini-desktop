id: PROD-EXPLORER-001
type: product_standard
title: Workspace Explorer Tree Navigation, Context Attachment & File Filtering
domain: product
status: approved
version: 1.1.0
authority:
  level: official
  confidence: high
owner:
  team: frontend_and_product

applies_to:
  - frontend
  - components
  - workspace

rule:
  "The Workspace Explorer provides an interactive, Visual Studio 2022-inspired hierarchical file tree docked on the right side of the workspace canvas. Files and folders are loaded dynamically on demand without artificial file limits, and users can attach files or directories directly to the chat prompt."

do:
  - "Dock Workspace Explorer to the right margin with collapsible auto-hide tab and horizontal resizing handle (240px–600px)."
  - "Load only root-level items initially on workspace mount/switch, keeping all directories collapsed by default for zero latency and instant rendering."
  - "Dynamically lazy-load subfolder contents on-demand via `read_workspace_dir` when a user clicks to expand a folder."
  - "Filter out dotfiles and dotfolders (names starting with `.`) by default, with an `Eye`/`EyeOff` toggle button in the toolbar to reveal them on demand."
  - "Provide a 'Collapse All Folders' action button (`ChevronsDownUp`) in the toolbar to quickly collapse the tree hierarchy."
  - "Provide multi-select mode (`isSelectMode`) with checkboxes to batch-select multiple files or folders and attach them to chat context with one click."
  - "Provide instant single-click inline attachment (`Paperclip` icon) and `@mention` insertion (`@` icon) on hover for any file or directory row."
  - "Render distinct Visual Studio 2022 color badges and icons based on file type and extension."
  - "Support context menu actions: open in system default app, reveal in Windows Explorer, and copy relative path."
  - "Provide keyboard shortcut: `Ctrl+Alt+L` to toggle Workspace Explorer."

dont:
  - "Do not preload entire multi-thousand file trees upfront or cap browsing at arbitrary limits like 3,000 files."
  - "Do not provide an 'Expand All' option that can accidentally mount tens of thousands of DOM nodes and freeze the webview."
  - "Do not implement tree-wide recursive auto-expanding search inside the explorer panel that degrades DOM performance on massive repositories."
  - "Do not display hidden configuration or dotfiles by default unless toggled via the toolbar."

reason:
  "Dynamic on-demand directory fetching (`std::fs::read_dir`) ensures instantaneous tree interaction and supports projects with tens of thousands of files without UI freezes, DOM bloat, or arbitrary file caps."

related_items:
  - PROD-WS-001
  - PROD-ATTACH-001
  - DEV-SVELTE-001
