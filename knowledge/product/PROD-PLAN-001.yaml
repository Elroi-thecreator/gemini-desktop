id: PROD-PLAN-001
type: product_standard
title: Interactive Plan Mode Workbench, Checklist Extraction & Real-Time Sync Standard
domain: product
status: approved
version: 1.0.0
authority:
  level: official
  confidence: high
owner:
  team: product_ux_team

applies_to:
  - frontend
  - components
  - chat_view

rule:
  "The Plan Mode Workbench provides an interactive checklist interface for reviewing, editing, approving, and tracking multi-step implementation plans generated by the agent or manually authored by the user. Plan tasks and workbench visibility must be strictly scoped to the active conversation, non-intrusive on workspace open, and synchronized automatically with turn completion and assistant markdown output."

do:
  - "Default the Plan Mode Workbench to hidden (closed) when opening or switching workspaces, even when the policy approval mode is set to Plan Mode."
  - "Provide a dedicated header toggle button (`[📋 Plan]`) with a live completion counter badge (`Plan N/N`) reflecting the active conversation's task progress."
  - "Scope all plan tasks and checklist state strictly to the active conversation ID (`session.id`), caching per-session tasks in memory and local storage (`gemini_plan_tasks_${sessionId}`)."
  - "Permanently purge a conversation's plan tasks and cache when that conversation is deleted via `handleDeleteSession`."
  - "Allow users to manually add custom steps via an inline text input and delete unwanted tasks via a per-row trash button."
  - "Auto-open the workbench when an active streaming turn outputs a newly drafted implementation plan containing markdown task checkboxes (`- [ ]`) or numbered steps (`Step N:`)."
  - "Compile the exact list of approved pending tasks (`- [ ]`) and completed tasks (`- [x]`) into the execution prompt when clicking `Approve & Execute (Auto-Edit)` or `Approve & Execute (Ask)`, eliminating agent hallucinations."
  - "Synchronize completed checkboxes in real time when the agent streams `- [x] <task>` during execution."
  - "Automatically mark all remaining tasks in the executed plan batch as completed (`100% Completed`) upon turn completion, turning the progress bar and counter badge emerald green."
  - "Disable execution buttons and surface 'All Tasks Completed' when 100% of tasks are completed to prevent accidental duplicate execution."

dont:
  - "Never show the Plan Mode Workbench by default when a workspace opens or when switching between conversations."
  - "Never share workbench tasks globally across different conversation threads."
  - "Never retain deleted conversations' plan tasks in memory or local storage."
  - "Never execute arbitrary or hallucinated tasks; always dispatch the exact user-vetted checklist items."

reason:
  "Structured implementation plans require interactive oversight before execution and visual progress feedback during execution without intrusive UI obstruction or task leakage across unrelated chat threads."

related_items:
