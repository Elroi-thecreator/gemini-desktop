id: DEV-TEST-001
type: development_standard
title: Automated Verification, svelte-check & Cargo Test Standards
domain: development
status: approved
version: 1.0.0
authority:
  level: official
  confidence: high
owner:
  team: quality_assurance

applies_to:
  - backend
  - frontend
  - ci_cd

rule:
  "Every change to the codebase must pass type validation (`npm run check`) and Rust backend unit tests (`cargo test --lib`). To produce or verify native desktop production release executables and Windows installers, run `npm run tauri build`. Note that `npm run build` compiles only the frontend static SPA into `build/` and does not compile native binaries."

do:
  - "Run `npm run check` (`svelte-kit sync && svelte-check --tsconfig ./tsconfig.json`) and enforce 0 errors and 0 warnings before committing."
  - "Maintain in-memory SQLite unit tests in `database.rs` to verify table initialization, default seeding, cascades, and FTS5 search."
  - "Maintain Rust backend unit tests in `process_manager.rs` and `commands.rs` covering model argument extraction, .env parsing, git context resolution, and MCP configurations."
  - "Always run `npm run tauri build` to compile the native Rust backend and package production desktop artifacts (`gemini-desktop.exe`, `.msi`, and `-setup.exe`) in `src-tauri/target/release/`."
  - "Use `npm run build` solely for testing frontend static compilation into `build/`."

dont:
  - "Do not disable or bypass compiler warnings or type checks using `@ts-ignore` without documented justification."
  - "Do not commit changes with failing Rust tests."
  - "Do not run `npm run build` when asked to build or verify a release of the desktop application; `npm run build` only bundles webview assets without compiling Rust or packaging native executables."

reason:
  "Automated gate checks prevent broken production binaries and ensure continuous release reliability across all platforms."

related_items:
  - DEV-SVELTE-001
  - DEV-RUST-001
  - ADR-004
